<section id="panelCorteCaja">
  <section class="cash-summary">
    <article>
      <small>Ingresos</small>
      <strong id="cajaTotal">$0.00</strong>
    </article>

    <article>
      <small>Salidas y ajustes</small>
      <strong id="cajaDevoluciones">$0.00</strong>
    </article>

    <article>
      <small>Neto de caja</small>
      <strong id="cajaNeto">$0.00</strong>
    </article>

    <article>
      <small>Efectivo</small>
      <strong id="cajaEfectivo">$0.00</strong>
    </article>

    <article>
      <small>Transferencia</small>
      <strong id="cajaTransferencia">$0.00</strong>
    </article>

    <article>
      <small>Movimientos</small>
      <strong id="cajaMovimientos">0</strong>
    </article>
  </section>

  <div class="cash-table-wrap">
    <table class="cash-table">
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Folio</th>
          <th>Cliente</th>
          <th>Tipo</th>
          <th>Método</th>
          <th>Importe</th>
          <th>Vendedor</th>
          <th>Acción</th>
        </tr>
      </thead>

      <tbody id="tablaCaja"></tbody>
    </table>

    <div id="sinMovimientosCaja" class="empty hidden">
      No hay movimientos de caja en el periodo seleccionado.
    </div>
  </div>

  <div class="dialog-actions wrap">
    <button
      id="btnExportarCaja"
      type="button"
      class="secondary"
    >
      Exportar caja a Excel
    </button>

    <button
      id="btnImprimirCaja"
      type="button"
      class="primary"
    >
      Imprimir reporte
    </button>
  </div>

  <dialog id="modalDetallePedidoCaja" class="modal-detalle-caja">
    <div class="detalle-caja-contenido">
      <div class="detalle-caja-header">
        <h2>Detalle del pedido</h2>
        <button id="btnCerrarDetallePedidoCaja" type="button" class="icon-button" aria-label="Cerrar detalle">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>

      <div class="detalle-caja-datos">
        <div>
          <small>Cliente</small>
          <strong id="detalleCajaCliente">—</strong>
        </div>
        <div>
          <small>Vendedor</small>
          <strong id="detalleCajaVendedor">—</strong>
        </div>
      </div>

      <section class="detalle-caja-productos-wrap">
        <h3>Productos</h3>
        <div id="detalleCajaProductos" class="detalle-caja-productos"></div>
      </section>

      <div class="dialog-actions">
        <button id="btnCerrarDetallePedidoCajaPie" type="button" class="secondary">Cerrar</button>
      </div>
    </div>
  </dialog>

</section>
